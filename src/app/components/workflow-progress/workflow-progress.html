<div class="workflow">

  @for (
    step of steps;
    track step;
    let i = $index
  ) {

    <div class="workflow-step">

      <span class="circle">
        {{ i + 1 }}
      </span>

      <span class="label">
        {{ step }}
      </span>

    </div>

    @if (i < steps.length - 1) {
      <span class="line"></span>
    }

  }

</div>
